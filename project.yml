name: FreeTypist
options:
  bundleIdPrefix: com.freetypist
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # Update checker. Pinned to a major version: Sparkle's 2.x line keeps the
  # SPUStandardUpdaterController API stable, and 3.x does not exist yet.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Apple Silicon only: llama.cpp inference runs on Metal. Building universal
    # would need an x86_64 llama slice.
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  FreeTypist:
    type: application
    platform: macOS
    sources:
      - path: FreeTypist
        excludes:
          # Consumed via INFOPLIST_FILE; it must not also be copied as a resource.
          - Info.plist
    dependencies:
      # Dynamic framework: it must be embedded and signed, not just linked.
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
      - sdk: libsqlite3.tbd
      # Brings Sparkle.framework, its XPC services and Autoupdate.app along.
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freetypist.app
        PRODUCT_NAME: FreeTypist
        ASSETCATALOG_COMPILER_APPICON_NAME: FreeTypist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FreeTypist/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: FreeTypist/FreeTypist.entitlements
    scheme:
      testTargets: []
